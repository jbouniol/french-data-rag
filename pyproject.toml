[project]
name = "alter-ego"
version = "0.1.0"
description = "Alter-Ego: assistant RAG + agent sur le Code du travail (apprentissage)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=1.0",
    "ollama>=0.6.3",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.14.1",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.7.0",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = [".", "eval/analysis"]
testpaths = ["tests", "eval/analysis"]
